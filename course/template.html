<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Cupcake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* A bakery display case: the menu is a row of cupcakes, each lesson one that gets decorated when you finish it. */
:root {
  --bg: #fbf6f8; --paper: #ffffff; --ink: #2b1d24; --muted: #7a6670; --line: #f0e2e8;
  --berry: #d6336c; --berry-dark: #9e1f4f; --berry-light: #fde3ec; --cheek: #ff8fb1; --frosting: #ffc2d9; --wrapper: #f2b263; --wrapper-dark: #b8742c;
  --gold: #ffc21c; --sun: #ffc93c; --glasses: #1f1f1f; --glasses-border: #000000; --sun-light: #fff4cf; --sky: #4aa3df; --sky-light: #e3f2fc;
  --ok: #2f8a41; --ok-light: #e2f5e5; --bad: #d64535; --bad-light: #fde8e5;
  --code-bg: #fff8fb;
  --c-kw: #d6336c; --c-bi: #0e7c86; --c-str: #2f8a57; --c-num: #c2571a; --c-com: #a08a95; --c-cons: #a3368f; --c-fn: #7c3aed; --c-field: #b5476e;
  --shadow: 0 2px 0 rgba(29, 43, 38, .06), 0 8px 24px rgba(29, 43, 38, .06);
  --title-font: "Baloo 2", "Nunito", system-ui, sans-serif;
  --body-font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171114; --paper: #211920; --ink: #f6e9ef; --muted: #b9a3ae; --line: #33252d;
    --berry: #ff6b9a; --berry-dark: #d0457a; --berry-light: #3d1f2a; --cheek: #ff8fb1; --frosting: #ffc2d9; --wrapper: #f2b263; --wrapper-dark: #b8742c;
    --gold: #ffd04a; --sun: #ffd25c; --glasses: #141414; --glasses-border: #8a8a8a; --sun-light: #3a3218; --sky: #6db8ec; --sky-light: #182c3a;
    --ok: #6fd383; --ok-light: #1c3324; --bad: #ff8f80; --bad-light: #3b1f1b;
    --code-bg: #1e1418;
    --c-kw: #ff6b9a; --c-bi: #6cd4e0; --c-str: #8fe0a8; --c-num: #ffb86b; --c-com: #8a7480; --c-cons: #f2a3e0; --c-fn: #c4a3ff; --c-field: #ffb3cd;
    --shadow: 0 2px 0 rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #171114; --paper: #211920; --ink: #f6e9ef; --muted: #b9a3ae; --line: #33252d;
  --berry: #ff6b9a; --berry-dark: #d0457a; --berry-light: #3d1f2a; --cheek: #ff8fb1; --frosting: #ffc2d9; --wrapper: #f2b263; --wrapper-dark: #b8742c;
  --gold: #ffd04a; --sun: #ffd25c; --glasses: #141414; --glasses-border: #8a8a8a; --sun-light: #3a3218; --sky: #6db8ec; --sky-light: #182c3a;
  --ok: #6fd383; --ok-light: #1c3324; --bad: #ff8f80; --bad-light: #3b1f1b;
  --code-bg: #1e1418;
  --c-kw: #ff6b9a; --c-bi: #6cd4e0; --c-str: #8fe0a8; --c-num: #ffb86b; --c-com: #8a7480; --c-cons: #f2a3e0; --c-fn: #c4a3ff; --c-field: #ffb3cd;
  --shadow: 0 2px 0 rgba(0, 0, 0, .25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
code, pre, textarea { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.65 var(--body-font); }
h1, h2, h3 { font-family: var(--title-font); line-height: 1.15; text-wrap: balance; }
code { font-family: var(--mono); font-size: .86em; background: var(--berry-light); padding: .08em .38em; border-radius: 6px; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---- header */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 8px 20px; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 2px solid var(--line); }
.logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font: 800 1.35rem/1 var(--title-font); }
.logo svg { width: 32px; height: 32px; }
.logo b { font-weight: 800; }
.logo span { color: var(--berry-dark); }
.spacer { flex: 1; }
.stars { font: 700 .95rem var(--title-font); color: var(--muted); white-space: nowrap; }
.stars b { color: var(--ink); }
.engine { border: 2px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 2px 12px; font-size: .82rem; white-space: nowrap; }
.engine::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 6px; vertical-align: 1px; }
.engine[data-status="loading"]::before { background: var(--sun); animation: pulse 1s infinite; }
.engine[data-status="ready"]::before { background: var(--berry); }
.engine[data-status="error"]::before { background: var(--bad); }
@keyframes pulse { 50% { opacity: .3; } }
.theme { border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px; width: 36px; height: 32px; }

/* ---- layout */
.frame { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 36px; max-width: 1150px; margin: 0 auto; padding: 26px 20px 90px; }
nav.sidebar { position: sticky; top: 76px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; padding: 4px 4px 4px 0; }
nav.sidebar summary { display: none; }
nav.sidebar ol { list-style: none; margin: 0; padding: 0 0 0 6px; position: relative; }
nav.sidebar ol::before { content: ""; position: absolute; left: 25px; top: 18px; bottom: 18px; width: 4px; background: var(--line); border-radius: 4px; }
nav.sidebar li a { position: relative; display: flex; gap: 12px; align-items: center; padding: 5px 8px 5px 0; color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.3; border-radius: 12px; }
nav.sidebar .seg { flex: 0 0 40px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--paper); border: 3px solid var(--line);
  font: 800 .9rem var(--title-font); color: var(--muted); z-index: 1; transition: background .3s, border-color .3s; }
nav.sidebar li a:hover .seg { border-color: var(--berry); }
nav.sidebar li a.active { font-weight: 800; }
nav.sidebar li a.active .seg { border-color: var(--berry-dark); color: var(--berry-dark); }
nav.sidebar li.done .seg { background: var(--berry); border-color: var(--berry-dark); color: #fff; }
main { min-width: 0; max-width: 790px; }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 16px 16px 70px; }
  nav.sidebar { position: static; max-height: none; background: var(--paper); border: 2px solid var(--line); border-radius: 16px; padding: 4px 8px; }
  nav.sidebar summary { display: block; padding: 8px 4px; font: 700 1rem var(--title-font); cursor: pointer; }
  .stars { display: none; }
  .topbar { padding: 8px 16px; }
}
@media (max-width: 480px) { .logo { font-size: 1.15rem; } .engine { font-size: .72rem; } }

/* ---- lesson heading */
.scene { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center; gap: 12px; margin-bottom: 26px; }
.scene .num { font: 800 .85rem var(--title-font); letter-spacing: .08em; text-transform: uppercase; color: var(--berry-dark); }
.scene h1 { font-size: clamp(2rem, 5vw, 2.9rem); margin: 4px 0 0; }
.drawing { position: relative; }
.drawing svg { width: 100%; height: auto; display: block; overflow: visible; }
.bubble { position: relative; background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; padding: 10px 16px; font: 700 1.05rem/1.35 var(--title-font); margin: 0 0 10px auto; max-width: 300px; box-shadow: 4px 4px 0 var(--sun); }
.bubble::after { content: ""; position: absolute; bottom: -14px; right: 70px; border: 12px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
@media (max-width: 640px) { .scene { grid-template-columns: minmax(0, 1fr); } .bubble { margin: 0 auto 8px 0; } }
.happy-dance { animation: dance .9s ease-in-out 2; transform-origin: 60% 80%; }
@keyframes dance { 25% { transform: rotate(-4deg) translateY(-6px); } 75% { transform: rotate(4deg) translateY(-6px); } }

/* ---- sections */
section.part { margin: 0 0 38px; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 1.5rem; margin: 0 0 12px; }
h2 .icon { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--berry-light); font-size: 1rem; flex: none; }
.story { background: var(--sky-light); border-radius: 20px; padding: 6px 22px; font-size: 1.08rem; }
.idea p, .idea li { max-width: 68ch; }
.idea ul { padding-left: 1.3em; }
.idea li { margin: .25em 0; }
pre.code-static { margin: 14px 0; padding: 14px 18px; background: var(--code-bg); border: 2px solid var(--line); border-radius: 14px; font: 14.5px/1.6 var(--mono); overflow-x: auto; }
.caption { margin: 18px 0 8px; }

/* ---- code card */
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); margin: 10px 0 24px; overflow: hidden; }
.editor { position: relative; display: grid; background: var(--code-bg); border-bottom: 2px solid var(--line); }
.editor > * { grid-area: 1 / 1; margin: 0; padding: 16px 18px; font: 15px/1.6 var(--mono); tab-size: 4; white-space: pre; border: 0; letter-spacing: 0; }
.editor pre { overflow: hidden; pointer-events: none; color: var(--ink); }
.editor textarea { resize: none; background: transparent; color: transparent; caret-color: var(--ink); outline: none; overflow-x: auto; overflow-y: hidden; min-height: 3.2em; }
.editor textarea:focus-visible { box-shadow: inset 0 0 0 3px var(--sky); }
.editor textarea::selection { background: color-mix(in srgb, var(--sky) 35%, transparent); }
.t-kw { color: var(--c-kw); font-weight: 600; } .t-bi { color: var(--c-bi); } .t-str { color: var(--c-str); }
.t-num { color: var(--c-num); } .t-com { color: var(--c-com); font-style: italic; } .t-cons { color: var(--c-cons); font-weight: 600; }
.t-int { color: var(--c-kw); }
.t-fn { color: var(--c-fn); font-weight: 600; } .t-field { color: var(--c-field); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; }
.btn { border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 12px; padding: 6px 14px; font-weight: 700; font-size: .92rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--berry); border-color: var(--berry-dark); color: #fff; box-shadow: 0 3px 0 var(--berry-dark); }
.btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--berry-dark); }
.btn.sun { background: var(--sun); border-color: #d9a419; color: #3b2d00; box-shadow: 0 3px 0 #d9a419; }
.btn:disabled { opacity: .55; cursor: progress; }
.actions .shortcut { margin-left: auto; color: var(--muted); font-size: .8rem; }
.answers { display: flex; gap: 10px; align-items: flex-start; padding: 0 12px 10px; }
.answers label { font: 700 .85rem var(--title-font); color: var(--muted); padding-top: 6px; white-space: nowrap; }
.answers textarea { flex: 1; min-width: 0; font: 14px/1.5 var(--mono); border: 2px solid var(--line); border-radius: 10px; background: var(--code-bg); color: var(--ink); padding: 6px 10px; resize: vertical; }
.output { margin: 0; padding: 12px 18px; border-top: 2px solid var(--line); font: 14.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; background: var(--code-bg); }
.output .note { display: block; font: 600 .78rem var(--body-font); color: var(--muted); margin-bottom: 4px; }
.problem { margin: 0; padding: 12px 18px; border-top: 2px solid var(--line); background: var(--bad-light); }
.problem b { display: block; font: 800 1rem var(--title-font); color: var(--bad); }
.problem pre { margin: 4px 0 0; font: 14px/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.file { border-top: 2px dashed var(--line); }
.file .name { padding: 8px 18px 0; font: 700 .82rem var(--title-font); color: var(--muted); }
.file pre { margin: 0; padding: 6px 18px 12px; font: 13.5px/1.55 var(--mono); overflow-x: auto; }

/* ---- exercises */
.exercise .task { padding: 14px 18px; border-bottom: 2px solid var(--line); background: var(--sun-light); }
.exercise .task b.tag { display: inline-block; font: 800 .8rem var(--title-font); letter-spacing: .08em; text-transform: uppercase; color: #a16207; margin-right: 6px; }
.exercise.solved .task { background: var(--ok-light); }
.exercise.solved .task b.tag { color: var(--ok); }
.exercise.solved .task b.tag::after { content: " · " attr(data-solved); }
.checks { list-style: none; margin: 0; padding: 10px 18px; border-top: 2px solid var(--line); }
.checks li { display: grid; grid-template-columns: 26px 1fr; gap: 2px; padding: 3px 0; }
.checks li::before { font-weight: 800; }
.checks li.pass::before { content: "✓"; color: var(--ok); }
.checks li.fail::before { content: "✗"; color: var(--bad); }
.checks li .check-hint { grid-column: 2; color: var(--muted); font-size: .92rem; }
.party { display: flex; align-items: center; gap: 12px; margin: 0; padding: 10px 18px; background: var(--ok-light); border-top: 2px solid var(--line); font: 800 1.1rem var(--title-font); color: var(--ok); }
.party svg { width: 70px; height: 46px; flex: none; }
.hints { padding: 0 18px; }
.hints p { margin: 10px 0; padding: 8px 12px; background: var(--sun-light); border-radius: 10px; font-size: .95rem; }
.solution { border-top: 2px solid var(--line); }
.solution pre { margin: 0; padding: 14px 18px; font: 14px/1.6 var(--mono); background: var(--code-bg); overflow-x: auto; }

/* ---- remember */
.remember { background: var(--sun-light); border-radius: 6px 22px 22px 22px; padding: 14px 22px; transform: rotate(-.4deg); box-shadow: 4px 5px 0 var(--sun); }
.remember ul { margin: 6px 0; padding-left: 1.2em; }
.remember li { margin: .3em 0; }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 40px; }
.pager a { text-decoration: none; padding: 10px 16px; border: 2px solid var(--line); border-radius: 14px; background: var(--paper); color: var(--ink); max-width: 48%; font-weight: 700; }
.pager a small { display: block; color: var(--muted); font-size: .78rem; font-weight: 600; }
.pager a.next { margin-left: auto; text-align: right; border-color: var(--berry); }
/* code looks exactly as typed: "==" is two signs, not one */
.map { margin: 18px 0; border-radius: 22px; overflow: hidden; border: 2px solid var(--line); }
.map svg { display: block; width: 100%; height: auto; }
.places { list-style: none; padding: 0; margin: 0 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; }
@media (max-width: 640px) { .places { grid-template-columns: minmax(0, 1fr); } }
.places a { display: flex; gap: 10px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 4px 6px; border-radius: 10px; }
.places a:hover { background: var(--paper); }
.places b { font-family: var(--title-font); color: var(--berry); min-width: 1.6em; }
.places li.lit b { color: #d99a1e; }
.places small { display: block; color: var(--muted); font-size: .82rem; }
code, pre, textarea, .editor > * { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0 !important; }
</style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="#hello" aria-label=""><svg id="logo" viewBox="0 0 320 200" aria-hidden="true"></svg><b>Cup<span>cake</span></b></a>
  <div class="spacer"></div>
  <div class="stars" id="stars"></div>
  <button class="engine" id="engine" data-status="idle"></button>
  <button class="theme" id="theme">◐</button>
</header>
<div class="frame">
  <nav class="sidebar" id="sidebar"><details id="det" open><summary id="lessons-summary"></summary><ol id="toc"></ol></details></nav>
  <main id="content"></main>
</div>

<script id="data" type="application/json">/*DATA*/null</script>
<script id="sources" type="application/json">/*SOURCES*/null</script>
<script id="ui" type="application/json">/*UI*/null</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("data").textContent);
const SOURCES = JSON.parse(document.getElementById("sources").textContent);
const LESSONS = DATA.lessons;
const UI = JSON.parse(document.getElementById("ui").textContent);
const fill = (text, values) => text.replace(/\{(\w+)\}/g, (_, k) => values[k]);
document.title = UI.pageTitle;
document.querySelector(".logo").setAttribute("aria-label", UI.home);
document.getElementById("engine").title = UI.engineTitle;
document.getElementById("engine").textContent = UI.engineOff;
document.getElementById("theme").title = UI.changeColors;
document.getElementById("theme").setAttribute("aria-label", UI.changeColors);
document.getElementById("sidebar").setAttribute("aria-label", UI.lessons);
document.getElementById("lessons-summary").textContent = UI.lessons;

// ------------------------------------------------------------------ browser memory
const STORAGE_KEY = "Cupcake-course-v1";
let memory = { solved: {}, code: {}, theme: null };
try { Object.assign(memory, JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}")); } catch (e) {}
let pending = null;
function save() {
  clearTimeout(pending);
  pending = setTimeout(() => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memory)); } catch (e) {} }, 250);
}

const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "html") n.innerHTML = v;
    else if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  for (const h of children) if (h != null) n.append(h);
  return n;
}
const escapeHtml = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const LABELS = UI.labels;
// ------------------------------------------------------------------ the Cupcake gang
// Five cupcakes named after flavors. Each one is drawn in a 100 × 100 box: frosting in its color,
// a light paper cup of the same color, its own topper and a little face. No arms or legs.
// LABELS (the words inside the drawings) comes from the page's UI strings.
const GANG = {
  Raspberry: { frosting: "#d6336c", edge: "#9e1f4f", cup: "#fde3ec",
    topper: `<circle cx="50" cy="16" r="7" fill="#e0233c" stroke="#9e1428" stroke-width="1.5"/><circle cx="48" cy="14" r="2" fill="#fff" opacity=".8"/>` },
  Vanilla:   { frosting: "#f6dfa0", edge: "#c99a2e", cup: "#fff6dc",
    topper: `<path d="M50 6 l3 6 6.5 1 -4.7 4.5 1.1 6.5 -5.9 -3.1 -5.9 3.1 1.1 -6.5 -4.7 -4.5 6.5 -1 z" fill="#d99a1e"/>` },
  Cinnamon:  { frosting: "#b5652b", edge: "#7a3f14", cup: "#f6e1cf",
    topper: `<path d="M50 16 m-6 0 a6 6 0 1 1 6 6 a3.5 3.5 0 1 1 3.5 -3.5" fill="none" stroke="#7a3f14" stroke-width="3" stroke-linecap="round"/>` },
  Mint:      { frosting: "#7fd3a4", edge: "#2f8a57", cup: "#e3f6ea",
    topper: `<path d="M50 20 q-10 -2 -11 -12 q10 1 11 12 z M50 20 q10 -2 11 -12 q-10 1 -11 12 z" fill="#2f8a57"/>` },
  Blueberry: { frosting: "#8f6ad8", edge: "#5b3aa8", cup: "#ece5fb",
    topper: `<circle cx="43" cy="15" r="4.5" fill="#3b2a8a"/><circle cx="57" cy="15" r="4.5" fill="#3b2a8a"/><circle cx="50" cy="9" r="4.5" fill="#3b2a8a"/>` },
};
const GANG_EYES = {
  happy:    `<path d="M39 64 q3.5 -4.5 7 0 M54 64 q3.5 -4.5 7 0" stroke="#2b1d24" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
  dots:     `<circle cx="42.5" cy="64" r="3" fill="#2b1d24"/><circle cx="57.5" cy="64" r="3" fill="#2b1d24"/><circle cx="43.5" cy="63" r="1" fill="#fff"/><circle cx="58.5" cy="63" r="1" fill="#fff"/>`,
  wow:      `<circle cx="42.5" cy="63" r="3.8" fill="#2b1d24"/><circle cx="57.5" cy="63" r="3.8" fill="#2b1d24"/><circle cx="43.8" cy="61.8" r="1.2" fill="#fff"/><circle cx="58.8" cy="61.8" r="1.2" fill="#fff"/>`,
  sleepy:   `<path d="M39 64 q3.5 3 7 0 M54 64 q3.5 3 7 0" stroke="#2b1d24" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
  wink:     `<circle cx="42.5" cy="64" r="3" fill="#2b1d24"/><path d="M54 64 q3.5 -4 7 0" stroke="#2b1d24" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
  dizzy:    `<path d="M40 61 l5 5 M45 61 l-5 5 M55 61 l5 5 M60 61 l-5 5" stroke="#2b1d24" stroke-width="2.4" stroke-linecap="round"/>`,
};
const GANG_MOUTH = {

// ------------------------------------------------------------------ code colors
const KEYWORDS = new Set("if else when while repeat for in at by break continue return stop fx try except finally raise assert use from as and or not has is".split(" "));
const CONSTANTS = new Set(["true", "false", "none", "it"]);
const BUILTINS = new Set("show read read_num len add drop sorted reversed filter map reduce count first last min max sum abs round int float str bool upper lower strip split join replace keys values load save roll pick".split(" "));
const TOKEN = /(#[^\n]*)|("""[\s\S]*?(?:"""|$)|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?)|(λ)|([^\W\d][\w]*)/gu;
function highlight(code) {
  let out = "", last = 0, m;
  TOKEN.lastIndex = 0;
  while ((m = TOKEN.exec(code))) {
    out += escapeHtml(code.slice(last, m.index));
    const t = escapeHtml(m[0]);
    let cls = null;
    if (m[1]) cls = "t-com";
    else if (m[2]) {
      out += `<span class="t-str">${t.replace(/(\{[^}]*\})/g, '<span class="t-int">$1</span>')}</span>`;
      last = TOKEN.lastIndex; continue;
    }
    else if (m[3]) cls = "t-num";
    else if (m[4]) cls = "t-kw";
    else if (/\.\s*$/.test(code.slice(Math.max(0, m.index - 2), m.index)) && !/\.\.$/.test(code.slice(Math.max(0, m.index - 2), m.index))) cls = "t-field";
    else if (/\b(fx|λ)\s+$/.test(code.slice(Math.max(0, m.index - 8), m.index)) && code[m.index + m[0].length] === "(") cls = "t-fn";
    else if (KEYWORDS.has(m[5])) cls = "t-kw";
    else if (CONSTANTS.has(m[5])) cls = "t-cons";
    else if (BUILTINS.has(m[5])) cls = "t-bi";
    out += cls ? `<span class="${cls}">${t}</span>` : t;
    last = TOKEN.lastIndex;
  }
  return out + escapeHtml(code.slice(last)) + "\n";
}

// ------------------------------------------------------------------ the editor
function makeEditor(code, whenChanged) {
  const pre = el("pre", { "aria-hidden": "true" });
  const area = el("textarea", { spellcheck: "false", autocapitalize: "off", autocomplete: "off", wrap: "off", "aria-label": "Cupcake code" });
  area.value = code;
  const box = el("div", { class: "editor" }, pre, area);
  function refresh() {
    pre.innerHTML = highlight(area.value);
    area.style.height = "auto";
    area.style.height = area.scrollHeight + "px";
  }
  area.addEventListener("input", () => { refresh(); whenChanged && whenChanged(area.value); });
  area.addEventListener("scroll", () => { pre.scrollLeft = area.scrollLeft; });
  area.addEventListener("focus", () => engine.load().catch(() => {}), { once: true });
  area.addEventListener("keydown", ev => {
    if (ev.key === "Tab" && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey) {
      ev.preventDefault();
      document.execCommand("insertText", false, "    ") || area.setRangeText("    ", area.selectionStart, area.selectionEnd, "end");
      refresh();
    } else if (ev.key === "Tab" && ev.shiftKey) {             // Shift+Tab: removes indentation
      ev.preventDefault();
      const lineStart = area.value.lastIndexOf("\n", area.selectionStart - 1) + 1;
      const toRemove = area.value.slice(lineStart, lineStart + 4).match(/^ */)[0].length;
      if (toRemove) {
        const pos = area.selectionStart;
        area.setRangeText("", lineStart, lineStart + toRemove, "preserve");
        area.selectionStart = area.selectionEnd = Math.max(lineStart, pos - toRemove);
        refresh(); whenChanged && whenChanged(area.value);
      }
    } else if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) {
      ev.preventDefault();
      box.dispatchEvent(new CustomEvent("run", { bubbles: true }));
    } else if (ev.key === "Enter" && !ev.shiftKey && !ev.altKey) {   // Enter: keeps the indentation, and adds 4 after ":"
      const lineStart = area.value.lastIndexOf("\n", area.selectionStart - 1) + 1;
      const line = area.value.slice(lineStart, area.selectionStart);
      let indent = line.match(/^ */)[0];
      if (/:\s*(#.*)?$/.test(line.split("#")[0].trimEnd() + " ") || /:\s*$/.test(line)) indent += "    ";
      ev.preventDefault();
      document.execCommand("insertText", false, "\n" + indent) || area.setRangeText("\n" + indent, area.selectionStart, area.selectionEnd, "end");
      refresh();
    }
  });
  const editor = { box, area, get value() { return area.value; }, set value(v) { area.value = v; refresh(); whenChanged && whenChanged(v); }, refresh };
  requestAnimationFrame(refresh);
  new ResizeObserver(() => refresh()).observe(box);
  refresh();
  return editor;
}

// ------------------------------------------------------------------ Cupcake inside the browser (Pyodide)
const BRIDGE = `
import sys, os, json, traceback
sys.path.insert(0, "/home/pyodide")
os.chdir("/home/pyodide")
import bridge
INTERNAL_ERROR = ${JSON.stringify(UI.internalError)}

def _guard(fn):
    try:
        return json.dumps(fn())
    except BaseException:
        return json.dumps({"status": "error", "output": "", "line": None, "results": [], "all_passed": False,
                           "error": INTERNAL_ERROR + traceback.format_exc()})

def _run(source, inputs, files):
    return _guard(lambda: bridge.run(source, inputs, json.loads(files)))

def _check(source, inputs, checks, files):
    return _guard(lambda: bridge.check(source, inputs, json.loads(checks), json.loads(files)))
`;
const engine = {
  py: null, promise: null, button: $("#engine"),
  status(e, text) { this.button.dataset.status = e; this.button.textContent = text; },
  origins() { return location.protocol === "file:" ? [DATA.pyodide] : ["pyodide/", DATA.pyodide]; },
  async tryBase(base) {
    if (typeof loadPyodide !== "function") {
      await new Promise((ok, reject) => {
        const s = el("script", { src: base + "pyodide.js" });
        s.onload = ok; s.onerror = () => { s.remove(); reject(new Error("could not find " + base + "pyodide.js")); };
        document.head.append(s);
      });
    }
    let timer;
    const deadline = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("did not respond within 90 seconds")), 90000); });
    const options = base === "pyodide/" ? { indexURL: base, stdLibURL: base + "python_stdlib.zip.wasm" } : { indexURL: base };
    try { return await Promise.race([loadPyodide(options), deadline]); } finally { clearTimeout(timer); }
  },
  load() {
    if (this.promise) return this.promise;
    const startedAt = Date.now();
    this.status("loading", UI.engineLoading);
    const ticker = setInterval(() => {
      if (this.button.dataset.status === "loading") this.button.textContent = `${UI.engineLoading} ${Math.round((Date.now() - startedAt) / 1000)} s`;
    }, 1000);
    this.promise = (async () => {
      const errors = [];
      let py = null;
      for (const base of this.origins()) {
        try { py = await this.tryBase(base); break; } catch (e) { errors.push(e.message); }
      }
      if (!py) throw new Error(errors.join("; "));
      for (const [n, f] of Object.entries(SOURCES)) py.FS.writeFile("/home/pyodide/" + n, f);
      py.runPython(BRIDGE);
      this.py = py;
      this.status("ready", UI.engineReady);
      return py;
    })().catch(err => { this.status("error", UI.engineError); this.promise = null; throw err; })
      .finally(() => clearInterval(ticker));
    return this.promise;
  },
  async call(name, ...args) {
    const py = await this.load();
    await new Promise(r => setTimeout(r, 15));
    const fn = py.globals.get(name);
    try { return JSON.parse(fn(...args)); } finally { fn.destroy(); }
  },
  run(code, inputs, files) { return this.call("_run", code, inputs, JSON.stringify(files || {})); },
  check(code, inputs, checks, files) { return this.call("_check", code, inputs, JSON.stringify(checks), JSON.stringify(files || {})); },
};
engine.button.addEventListener("click", () => engine.load().catch(() => {}));

function confirmWithButton(button, question, action) {
  if (button.dataset.confirming) { delete button.dataset.confirming; button.textContent = button.dataset.text; action(); return; }
  button.dataset.text = button.textContent;
  button.dataset.confirming = "1";
  button.textContent = question;
  setTimeout(() => { if (button.dataset.confirming) { delete button.dataset.confirming; button.textContent = button.dataset.text; } }, 4000);
}

function codeCard(op) {
  const saved = op.key ? memory.code[op.key] : null;
  const output = el("pre", { class: "output", hidden: true, "aria-live": "polite" });
  const problem = el("div", { class: "problem", hidden: true, "aria-live": "polite" });
  const editor = makeEditor(saved ?? op.code, v => {
    if (op.key) { if (v === op.code) delete memory.code[op.key]; else memory.code[op.key] = v; save(); }
    toggleAnswers();
  });
  const answers = el("textarea", { rows: "2", placeholder: UI.oneAnswerPerLine });
  answers.value = op.inputs || "";
  const answersRow = el("div", { class: "answers" }, el("label", {}, UI.answers), answers);
  function toggleAnswers() { answersRow.hidden = !/\b(read|read_num|ask)\s*\(/.test(editor.value); }
  toggleAnswers();

  const bRun = el("button", { class: "btn" + (op.main === false ? "" : " primary") }, UI.run);
  const bReset = el("button", { class: "btn", title: UI.startOverTitle }, UI.startOver);
  const actions = el("div", { class: "actions" }, bRun, bReset, el("span", { class: "shortcut" }, "Ctrl + Enter"));

  const files = Object.entries(op.files || {}).map(([n, c]) =>
    el("div", { class: "file" }, el("div", { class: "name" }, `file ${n}`), el("pre", { html: highlight(c) })));

  function showResult(r, note) {
    output.hidden = !(r.output || r.status === "ok");
    output.innerHTML = (note ? `<span class="note">${note}</span>` : "") + escapeHtml(r.output || (r.status === "ok" ? "(the program didn't show anything)" : ""));
    if (r.status === "error") {
      problem.hidden = false;
      problem.replaceChildren(el("b", {}, r.line ? fill(UI.problemOnLine, { line: r.line }) : UI.problem),
        el("pre", {}, (r.error || "") + (/\b(read|ask)\(\) (was waiting|expected|esperaba)/.test(r.error || "") ? "\n" + UI.typeAnswers : "")));
    } else problem.hidden = true;
  }
  async function run() {
    const code = editor.value, inp = answers.value;
    if (!engine.py && op.pre && code === op.code && inp === (op.inputs || "")) {
      showResult(op.pre, op.random ? UI.randomNote : UI.savedNote);
      engine.load().catch(() => {});
      return;
    }
    bRun.disabled = true;
    output.hidden = false; problem.hidden = true;
    output.textContent = engine.py ? UI.running : UI.warmingFirst;
    try { showResult(await engine.run(code, inp, op.files)); }
    catch (e) { showResult({ status: "error", output: "", error: UI.noConnection + e.message + ")" }); }
    finally { bRun.disabled = false; }
  }
  bRun.addEventListener("click", run);
  editor.box.addEventListener("run", () => (op.onCtrlEnter || run)());
  bReset.addEventListener("click", () => {
    const restore = () => { editor.value = op.code; answers.value = op.inputs || ""; };
    if (editor.value === op.code) restore(); else confirmWithButton(bReset, UI.eraseChanges, restore);
  });
  const box = el("div", { class: "card" }, ...(op.head || []), editor.box, ...files, answersRow, actions, ...(op.tail || []), output, problem);
  return { box, editor, answers, actions, showResult };
}

// ------------------------------------------------------------------ an exercise
function exerciseCard(l, exercise, i) {
  const key = `${l.id}:${i}`;
  const list = el("ul", { class: "checks", hidden: true });
  const party = el("p", { class: "party", hidden: true, html: drawScene("trophy", "happy-dance") + `<span>${UI.party}</span>` });
  const hints = el("div", { class: "hints" });
  const solution = el("div", { class: "solution", hidden: true });
  const task = el("div", { class: "task" }, el("b", { class: "tag", "data-solved": UI.solved }, fill(UI.challenge, { n: i + 1 })), el("span", { html: exercise.task }));
  const t = codeCard({ code: exercise.starter, inputs: exercise.inputs, files: exercise.files, key: "exercise:" + key, main: false,
    head: [task], tail: [hints, list, party, solution], onCtrlEnter: () => check() });
  const box = t.box;
  box.classList.add("exercise");
  if (memory.solved[key]) box.classList.add("solved");
  const bCheck = el("button", { class: "btn primary" }, "✓ Check");
  const bHint = el("button", { class: "btn sun" }, UI.hint);
  const bSolution = el("button", { class: "btn" }, UI.showSolution);
  t.actions.prepend(bCheck);
  t.actions.querySelector(".shortcut").before(bHint, bSolution);
  let n = 0;
  if (!exercise.hints.length) { bHint.disabled = true; bHint.textContent = UI.noHints; }

  async function check() {
    bCheck.disabled = true;
    list.hidden = false; party.hidden = true;
    list.innerHTML = `<li>${engine.py ? UI.checking : UI.warmingCheck}</li>`;
    try {
      const r = await engine.check(t.editor.value, t.answers.value, exercise.checks, exercise.files);
      t.showResult(r);
      list.replaceChildren(...r.results.map(x => el("li", { class: x.ok ? "pass" : "fail" },
        el("span", {}, x.text), x.hint ? el("span", { class: "check-hint" }, "→ " + x.hint) : null)));
      if (r.all_passed) {
        party.hidden = false;
        box.classList.add("solved");
        memory.solved[key] = true; save(); updateProgress();
        const big = $(".drawing svg"); if (big) { big.classList.remove("happy-dance"); void big.offsetWidth; big.classList.add("happy-dance"); }
      }
    } catch (e) {
      list.replaceChildren(el("li", { class: "fail" }, UI.noConnectionShort + e.message + ")"));
    } finally { bCheck.disabled = false; }
  }
  bCheck.addEventListener("click", check);
  bHint.addEventListener("click", () => {
    if (n >= exercise.hints.length) return;
    hints.append(el("p", { html: `<b>Hint ${n + 1}:</b> ` + exercise.hints[n] }));
    n++;
    bHint.textContent = n < exercise.hints.length ? UI.anotherHint : UI.noMoreHints;
    bHint.disabled = n >= exercise.hints.length;
  });
  bSolution.addEventListener("click", () => {
    if (!solution.hidden) { solution.hidden = true; bSolution.textContent = UI.showSolution; return; }
    if (!memory.solved[key] && !bSolution.dataset.confirming) {
      confirmWithButton(bSolution, UI.sureSolution, () => bSolution.click());
      return;
    }
    delete bSolution.dataset.confirming;
    solution.replaceChildren(el("pre", { html: highlight(exercise.solution) }),
      el("div", { class: "actions" }, el("button", { class: "btn", onclick: () => { t.editor.value = exercise.solution; } }, UI.copyToEditor)));
    solution.hidden = false; bSolution.textContent = UI.hideSolution;
  });
  return box;
}

const ICONS = {

function section(icon, title, ...children) {

function lessonPage(l) {

function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "map") {
    mapPage();
    document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("active", a.dataset.id === "map"));
    document.title = `${UI.mapTitle} · ${UI.pageTitle}`;
    if (matchMedia("(max-width: 900px)").matches) $("#det").open = false;
    window.scrollTo(0, 0);
    return;
  }
  if (id === "gallery") {
    galleryPage();
    document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("active", a.dataset.id === "gallery"));
    document.title = `${UI.gallery} · ${UI.pageTitle}`;
    if (matchMedia("(max-width: 900px)").matches) $("#det").open = false;
    window.scrollTo(0, 0);
    return;
  }
  const l = LESSONS.find(x => x.id === id) || LESSONS[0];
  lessonPage(l);
  document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("active", a.dataset.id === l.id));
  document.title = `${l.title} · ${UI.pageTitle}`;
  if (matchMedia("(max-width: 900px)").matches) $("#det").open = false;
  window.scrollTo(0, 0);
}

// ------------------------------------------------------------------ automatic test (?selftest)
if (new URLSearchParams(location.search).has("selftest")) (async () => {
  const report = [];
  const log = (ok, t) => report.push((ok ? "OK  " : "FAIL") + " " + t);
  try {
    await engine.load();
    log(true, "Pyodide loaded");
    let failures = 0;
    for (const l of LESSONS) {
      for (const [i, e] of l.examples.entries()) {
        const r = await engine.run(e.code, e.inputs, e.files);
        const differs = e.random ? r.status !== "ok" : (r.status !== e.pre.status || r.output !== e.pre.output);
        if (differs) { failures++; log(false, `${l.id} example ${i + 1}: ${r.status} ${r.error}\n${r.output}`); }
      }
      for (const [i, e] of (l.pokemon || []).entries()) {
        const r = await engine.run(e.code, e.inputs, e.files);
        const differs = e.random ? r.status !== "ok" : (r.status !== e.pre.status || r.output !== e.pre.output);
        if (differs) { failures++; log(false, `${l.id} pokémon ${i + 1}: ${r.status} ${r.error}\n${r.output}`); }
      }
      for (const [i, exercise] of l.exercises.entries()) {
        const s = await engine.check(exercise.solution, exercise.inputs, exercise.checks, exercise.files);
        const a = await engine.check(exercise.starter, exercise.inputs, exercise.checks, exercise.files);
        if (!s.all_passed || a.all_passed) { failures++; log(false, `${l.id} challenge ${i + 1}: solution ${s.all_passed}, starting code ${a.all_passed} ${s.error}`); }
      }
    }
    for (const p of DATA.gallery) {
      const r = await engine.run(p.code, p.inputs, p.files);
      const differs = p.random ? r.status !== "ok" : (r.status !== p.pre.status || r.output !== p.pre.output);
      if (differs) { failures++; log(false, `gallery ${p.title}: ${r.status} ${r.error}`); }
    }
    log(failures === 0, `whole course in the browser (${failures} ${failures === 1 ? "difference" : "differences"})`);
    location.hash = "#math"; await new Promise(r => setTimeout(r, 60));
    $(".card .btn.primary").click(); await new Promise(r => setTimeout(r, 1500));
    log(/300/.test($(".output").textContent), "Run button → " + $(".output").textContent.split("\n")[0]);
  } catch (e) { log(false, "exception: " + (e && e.stack || e)); }
  document.body.append(el("pre", { id: "selftest-result" }, report.join("\n")));
})();
